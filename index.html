<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Build weekly shift schedules that follow your store's rules.">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Shift Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one sticky header with week controls and tabs; a scrollable week grid as the main object; plain cards below for tallies and rules. */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#ececea; --ink:#0d0d0e; --muted:#5c5e61; --line:#d9d9d5;
  --accent:#b8f000; --accent-ink:#0d0d0e; --accent-soft:#eefbc8; --accent-text:#3d6a00;
  --open-bg:#fff0d1; --open-fg:#7a4f00;
  --close-bg:#e4e4f4; --close-fg:#3a3a8c;
  --mid-bg:#d9f0ea; --mid-fg:#0c6050;
  --pto-bg:#fbe2e5; --pto-fg:#962036;
  --off-fg:#8b8d90;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#995200; --warn-soft:#fff1dc; --good:#2f6b00; --good-soft:#eefbc8; --nav-bg:rgba(255,255,255,.82);
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#161618; --surface-2:#232326; --ink:#f4f4f2; --muted:#a3a3a7; --line:#2f2f33;
  --accent:#c4ff1a; --accent-ink:#0b0b0c; --accent-soft:#242e0b; --accent-text:#c4ff1a;
  --open-bg:#382d12; --open-fg:#ffd27a;
  --close-bg:#27273d; --close-fg:#c3c2ff;
  --mid-bg:#11332d; --mid-fg:#86e3d1;
  --pto-bg:#3f1e26; --pto-fg:#ffb0bf;
  --off-fg:#6e6e73;
  --bad:#ff8a7e; --bad-soft:#3a1d1b; --warn:#ffbe6b; --warn-soft:#352812; --good:#c4ff1a; --good-soft:#242e0b; --nav-bg:rgba(24,24,27,.78);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#161618; --surface-2:#232326; --ink:#f4f4f2; --muted:#a3a3a7; --line:#2f2f33;
  --accent:#c4ff1a; --accent-ink:#0b0b0c; --accent-soft:#242e0b; --accent-text:#c4ff1a;
  --open-bg:#382d12; --open-fg:#ffd27a;
  --close-bg:#27273d; --close-fg:#c3c2ff;
  --mid-bg:#11332d; --mid-fg:#86e3d1;
  --pto-bg:#3f1e26; --pto-fg:#ffb0bf;
  --off-fg:#6e6e73;
  --bad:#ff8a7e; --bad-soft:#3a1d1b; --warn:#ffbe6b; --warn-soft:#352812; --good:#c4ff1a; --good-soft:#242e0b; --nav-bg:rgba(24,24,27,.78);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
/* No double-tap zoom; scrolling still works. */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPhones zoom into any text box under 16px when tapped, so phone-sized screens use 16px in boxes. */
@media (max-width:700px){input,select,textarea{font-size:16px!important}}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input[type=checkbox]{accent-color:var(--accent-text);width:18px;height:18px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent-text)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bn-inner{pointer-events:auto;position:relative;display:flex;gap:2px;max-width:480px;margin:0 auto;padding:6px;border-radius:999px;background:var(--nav-bg);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.tab-ind{position:absolute;left:0;top:6px;bottom:6px;width:0;border-radius:999px;background:var(--accent-soft);pointer-events:none;transform-origin:center;will-change:transform,width}
.tab{flex:1 1 0;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;transition:color .2s}
.tab svg{width:24px;height:24px}
.bottom-nav.icons-only .tab span{display:none}
.bottom-nav.icons-only .tab{padding:12px 4px}
.bottom-nav.icons-only .tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent-text)}
main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.weeknav .lbl{min-width:0;padding:0 8px;text-align:center}
.weeknav .lbl b{display:block;font-size:15px;white-space:nowrap}
.weeknav .lbl span{font-size:12px;color:var(--muted)}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:wait}

.info{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.chip.has-input{border-radius:12px;padding:4px 4px 4px 12px}
.chip input{width:72px;padding:4px 8px;border-radius:8px;font-size:13px;font-family:var(--font-mono);min-height:0}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner{font-size:13px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 4px;font-weight:700}
.card h3{font-size:13px;margin:14px 0 6px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}

.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:460px}
.grid th,.grid td{padding:3px;border-bottom:1px solid var(--line);text-align:center}
.grid thead th{font-size:12px;font-weight:600;color:var(--muted);padding:8px 3px 6px;background:var(--surface)}
.grid thead th small{display:block;font-weight:400;font-family:var(--font-mono);font-size:11px}
.grid thead th.flag{color:var(--bad)}
.grid .namecol{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:6px 8px 6px 12px;min-width:92px;border-right:1px solid var(--line)}
.grid tbody tr:last-child td,.grid tbody tr:last-child th{border-bottom:0}
.pname{font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pname.flag{color:var(--bad)}
.pmeta{font-size:11px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.cell{width:100%;min-width:50px;height:50px;border:1px solid transparent;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;padding:2px;background:transparent}
.cell .k{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.cell .t{font-family:var(--font-mono);font-size:10.5px;white-space:nowrap}
.cell.open{background:var(--open-bg);color:var(--open-fg)}
.cell.close{background:var(--close-bg);color:var(--close-fg)}
.cell.mid{background:var(--mid-bg);color:var(--mid-fg)}
.cell.pto{background:var(--pto-bg);color:var(--pto-fg)}
.cell.off{color:var(--off-fg)}
.cell.off:hover{background:var(--surface-2)}
.cell.flag{box-shadow:inset 0 0 0 2px var(--bad)}
.cell .lock{position:absolute;top:3px;right:3px;width:10px;height:10px;opacity:.75}
.cell .lim{position:absolute;top:2px;left:4px;font-size:10px;font-weight:700}
.grid tfoot td,.grid tfoot th{font-size:12px;padding:6px 3px;border-top:1px solid var(--line);border-bottom:0;font-family:var(--font-mono)}
.grid tfoot th{font-family:var(--font-body);font-weight:600;color:var(--muted)}
.grid tfoot .short{color:var(--bad);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{font-size:14px;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:flex-start}
.issues li.rule{background:var(--bad-soft)}
.issues li.note{background:var(--warn-soft)}
.issues li .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.issues li.rule .dot{background:var(--bad)}
.issues li.note .dot{background:var(--warn)}

table.tally{width:100%;border-collapse:collapse;font-size:13px}
.tally th,.tally td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tally td{white-space:nowrap}
.tally td.txt{white-space:normal;overflow-wrap:anywhere}
.tally th{line-height:1.25}
.tally th.l{text-align:left;padding-left:8px}
.tally td.txt:not(:first-child){padding-left:8px}
.tally th:first-child,.tally td:first-child{text-align:left}
.tally thead th{color:var(--muted);font-weight:600;font-size:12px}
.tally td{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tally td.txt{font-family:var(--font-body);text-align:left;padding-left:0}
.tally th:first-child{padding-left:0}
.tally td:last-child,.tally th:last-child{padding-right:0}
.tally .short{color:var(--bad);font-weight:700}
.tally tr.total td{border-bottom:0;border-top:2px solid var(--line)}
.scrollx{overflow-x:auto}

.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.person:hover{border-color:var(--accent-text)}
.person .main{flex:1;min-width:0}
.person .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person .ds{font-size:13px;color:var(--muted)}
.person .lims{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--font-mono)}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:120px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:40px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
textarea{font-family:var(--font-mono);font-size:12px;min-height:180px;resize:vertical}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg.roles{display:grid;grid-template-columns:1fr 1fr}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.limit{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--surface-2)}
.limit .field{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.xchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-family:var(--font-mono);padding:3px 4px 3px 10px;border-radius:999px;background:var(--pto-bg);color:var(--pto-fg)}
.xchip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;color:inherit}
.check{display:flex;align-items:center;gap:8px;font-size:14px}

.rot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rot li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s ease}
.rot li.now{background:var(--accent-soft)}
.rot .grip{color:var(--muted);flex:none}
.rot li.holding{transform:scale(.98)}
.rot li.dragging{transition:none;z-index:3;border-color:var(--accent-text);box-shadow:0 10px 28px rgba(0,0,0,.35);cursor:grabbing}
.rot.is-dragging li:not(.dragging){transition:transform .15s ease}
.rot li.now{background:var(--accent-soft);border-color:transparent}
.rot .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);width:20px}
.rot .who{flex:1;font-weight:600}
.rot .now-tag{font-size:11px;font-weight:700;color:var(--accent-text)}
.shiftrows{display:flex;flex-direction:column;gap:10px}
.shiftrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.shiftrow:last-child{border-bottom:0;padding-bottom:0}
.shiftrow.added{grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.shiftrow .sr-sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.shiftrow .sr-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.shiftrow .sr-label{grid-column:1 / -1;font-size:13px;font-weight:600}
.shiftrow input{font-family:var(--font-mono);font-size:14px;padding:8px}
.shiftrow .sr-paid{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.shifttbl{width:100%;border-collapse:collapse;font-size:13px}
.shifttbl td,.shifttbl th{padding:4px;text-align:left;border-bottom:1px solid var(--line)}
.shifttbl th{font-weight:600;color:var(--muted);font-size:12px}
.shifttbl input{padding:6px;font-family:var(--font-mono);font-size:13px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group{border:1px solid var(--line);border-radius:8px;padding:10px}
.group.offnow{background:var(--surface-2)}
.group b{display:block;font-size:13px}
.group span{font-size:13px;color:var(--muted)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:18px}
.sheet-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.opt{border:2px solid transparent;border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt .k{font-weight:700;font-size:14px}
.opt .t{font-family:var(--font-mono);font-size:12px}
.opt .why{font-size:11px;color:var(--bad)}
.opt.off{background:var(--surface-2);color:var(--muted)}
.opt.open{background:var(--open-bg);color:var(--open-fg)}
.opt.close{background:var(--close-bg);color:var(--close-fg)}
.opt.mid{background:var(--mid-bg);color:var(--mid-fg)}
.opt.pto{background:var(--pto-bg);color:var(--pto-fg)}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:32px 16px}
.empty p{color:var(--muted);margin:6px 0 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
@media (max-width:520px){.actions{margin-left:0;width:100%}.actions .btn{flex:1;justify-content:center}.weeknav{width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/></svg>
        Shift Planner

function limitSummary(r) {

  return `${days}: ${fmtRange(r.start, r.end)} as ${r.countsAs}${wk}`;
}

/* Display preferences: text size scales the whole app (layout reflows to fit); appearance overrides the phone's light/dark setting. */
const TEXT_SIZES = [['1', 'Standard'], ['1.15', 'Large'], ['1.3', 'Extra large']];
function applyPrefs() {
  const pr = S.prefs || {};
  const z = parseFloat(pr.text) || 1;
  document.body.style.zoom = z !== 1 ? String(z) : '';
  // The tab bar grows less than the content (at most 1.15x) so all four tabs always fit across a phone.
  for (const el of document.querySelectorAll('header.top, .bottom-nav')) el.style.zoom = z > 1.15 ? String(1.15 / z) : '';
  const nav = document.querySelector('.bottom-nav'); if (nav) nav.classList.toggle('icons-only', pr.navLabels === false);
  if (pr.theme === 'light' || pr.theme === 'dark') document.documentElement.setAttribute('data-theme', pr.theme);
  else if (UI.themeSet) document.documentElement.removeAttribute('data-theme');
  UI.themeSet = pr.theme === 'light' || pr.theme === 'dark';
}

/* Group booked dates into runs of consecutive days for display. */
function timeOffRanges(dates) {
  const out = [];
  for (const dt of [...new Set(dates)].sort()) { const last = out[out.length - 1]; if (last && addDays(last[last.length - 1], 1) === dt) last.push(dt); else out.push([dt]); }

const Drag = {timer: null, li: null, x: 0, y: 0, active: false, items: [], from: 0, to: 0, step: 0};
function dragStart(li, x, y) { dragCancel(); Drag.li = li; Drag.x = x; Drag.y = y; li.classList.add('holding'); Drag.timer = setTimeout(dragActivate, 400); }
function dragActivate() {

  const next = Drag.items[1], first = Drag.items[0];

  Drag.active = true; li.classList.remove('holding'); li.classList.add('dragging'); li.parentElement.classList.add('is-dragging');

  if (e.cancelable) e.preventDefault();

  Drag.items.forEach((it, i) => {

    const shift = (Drag.from < to && i > Drag.from && i <= to) ? -Drag.step : (Drag.from > to && i < Drag.from && i >= to) ? Drag.step : 0;
    it.style.transform = shift ? `translateY(${shift}px)` : '';

}

  if (k === 'allow-mid') { S.settings.allowMid = el.checked; save(); render(); return; }
  if (k === 'budget-default') { const v = parseFloat(el.value); S.settings.budget = v > 0 ? Math.min(5000, v) : null; save(); render(); return; }
  if (k === 'budget-week') { const wk = S.weeks[UI.week]; if (wk) { const v = parseFloat(el.value); if (el.value === '') delete wk.budget; else if (v >= 0) wk.budget = Math.min(5000, v); save(); render(); } return; }
  if (k === 'setting') { S.settings[el.dataset.k] = num(el.value, 0, 20); save(); render(); return; }
  if (k === 'rolename') { S.roleNames = Object.assign({}, ROLE_DEFAULTS, S.roleNames || {}); S.roleNames[el.dataset.k] = el.value.trim().slice(0, 24) || ROLE_DEFAULTS[el.dataset.k]; save(); render(); return; }
  if (k === 'restore-file') {
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const ta = document.getElementById('restoretext'); if (ta) ta.value = String(r.result || ''); };
    r.onerror = () => { const m = document.getElementById('restoreMsg'); if (m) m.textContent = "That file couldn't be read."; };
    r.readAsText(f); return;
  }
  if (k === 'xs') { const x = S.extraShifts.find(z => z.id === el.dataset.id); if (x) { const f = el.dataset.f; if (f === 'auto') x.auto = el.checked; else if (el.value) x[f] = el.value; syncExtra(); save(); render(); } return; }
  if (k === 'shift') { if (el.value) { S.shifts[el.dataset.g][el.dataset.k][+el.dataset.i] = el.value; save(); render(); } return; }
  if (k === 'lock') { const wk = S.weeks[UI.week]; const s = UI.sheet; wk.locks[s.pid][s.d] = el.checked; save(); render(); return; }
  if (!P) return;
  if (k === 'p-name') { P.name = el.value.trim().slice(0, 24) || 'Unnamed'; }
  else if (k === 'p-max') P.maxHours = num(el.value, 0, 60);
  else if (k === 'p-days') P.daysPerWeek = num(el.value, 0, 7);
  else if (k === 'p-midoff') P.modMidOff = num(el.value, 1, 5);
  else if (k === 'p-rot') { if (el.checked) { if (!S.rotation.includes(P.id)) S.rotation.push(P.id); } else S.rotation = S.rotation.filter(id => id !== P.id); }
  else if (R && k === 'r-kind') R.kind = el.value;
  else if (R && k === 'r-weeks') R.weeks = el.value;
  else if (R && k === 'r-start') { if (el.value) R.start = el.value; }
  else if (R && k === 'r-end') { if (el.value) R.end = el.value; }
  else if (R && k === 'r-counts') R.countsAs = el.value;
  save(); renderSheet(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) { UI.confirmDel = false; closeSheet(); } });

save(true); render();
if (firstRun) doShuffle(true);
/* After an update, show what changed since the version this device last saw (not on a brand-new install). */
(() => {
  let seen = null; try { seen = localStorage.getItem(SEEN_KEY); } catch (e) {}
  if (!seen && !firstRun) seen = '2026.11.25-0000';   // devices that used the app before this window existed
  try { localStorage.setItem(SEEN_KEY, APP_VERSION); } catch (e) {}
  if (seen && APP_VERSION !== 'dev' && APP_VERSION > seen && CHANGELOG.some(e => e.v > seen)) setTimeout(() => openSheet({type: 'whatsnew', since: seen}), 600);
})();
cloudInit();
})();
</script>
